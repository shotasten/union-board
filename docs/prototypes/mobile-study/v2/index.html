<style>

:0;font-size:15px}.hint{font-size:11px;color:#586c79;margin:4px 0 7px}.warning{font-size:12px;padding:7px 9px;background:#fff;border-inline-start:3px solid #a95a36;margin-block:6px}.warning button{padding:0 4px;font-size:12px;min-block-size:44px;text-align:start;border:0;background:none}.warning b{color:#873f25}.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin:5px 0}.toolbar label{display:flex;align-items:center;gap:4px}.toolbar>label{flex:1}.toolbar select{min-inline-size:70px;max-inline-size:160px;flex:1}.toolbar button{font-size:12px}.scroll{overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:8px;background:#fff;max-block-size:calc(100vh - 345px);max-block-size:calc(100dvh - 345px);min-block-size:200px;scroll-padding-block-start:72px;scroll-padding-inline-start:90px;container:tablearea / inline-size}.scroll:focus-visible{outline-offset:0}table{border-spacing:0;border-collapse:separate;width:100%;font-size:12px}caption{font-size:11px;text-align:start;color:#60717c;padding:4px 8px;caption-side:bottom}th,td{border-inline-end:1px solid var(--line);border-block-end:1px solid var(--line);padding:0;text-align:center;min-block-size:48px}thead th{position:sticky;inset-block-start:0;background:#e8eff4;z-index:3;font-weight:600}tbody th{position:sticky;inset-inline-start:0;background:white;z-index:2}thead th:first-child{inset-inline-start:0;z-index:5}th button{font-size:12px;border-radius:0;border:0;background:transparent;min-block-size:48px;padding:4px}td button{border-radius:0;border:0;background:transparent;min-block-size:48px;inline-size:100%;padding:2px;font-size:18px}.raw th:first-child{min-inline-size:88px;max-inline-size:88px}.raw .member{min-inline-size:50px}.raw .member button{min-inline-size:48px;max-inline-size:68px;font-size:11px}.raw td{min-inline-size:50px;font-size:17px}.raw .symbol{display:block;padding:14px 2px}.yes{background:var(--green);color:#245235}.late{background:var(--yellow);color:#6b5110}.no{background:var(--red);color:#842c42}.unknown{background:var(--gray);color:#546371}.activecell{outline:3px solid #117790;outline-offset:-3px;position:relative}.minehead{background:#cfe6f1!important}.draft{box-shadow:inset 0 -4px #e2a335}#dock{position:fixed;inset-inline:0;inset-block-end:0;z-index:8;max-inline-size:1100px;margin-inline:auto;padding:0 8px}.dock{margin-block-start:7px;padding:8px max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:#fff;border:1px solid #b8cbd8;border-radius:9px;box-shadow:0 -3px 12px #18334812}.dock-heading{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:12px;margin-bottom:5px}.dock-heading strong{font-size:13px}.choices{display:flex;gap:5px;flex-wrap:wrap}.choices button{flex:1;font-size:20px;min-block-size:46px;min-inline-size:48px}.choices button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:-3px}.actions{display:flex;justify-content:space-between;gap:5px;align-items:center;margin-top:5px;font-size:12px;flex-wrap:wrap}.actions button{font-size:12px;min-block-size:44px}.primary{background:var(--ink);color:white;border-color:var(--ink)}.muted{color:#586c79;font-size:12px}.compare{table-layout:fixed}.compare th:first-child{width:82px}.compare th select{width:100%;font-size:12px;min-width:44px;border-radius:0;max-width:100%;border:0;background:#e8eff4}.compare th .col-label{display:block;font-size:10px;padding-top:4px}.compare td{font-size:19px}.compare td span{display:block;padding:14px 2px}.compare th button{width:100%}.query{table-layout:fixed;width:max-content;min-inline-size:100%}.query th:first-child{min-inline-size:94px;width:94px;max-inline-size:94px}.query thead th:not(:first-child),.query td{min-inline-size:34px;width:34px;max-inline-size:34px}.query tbody th button{width:100%;min-block-size:48px}.query td{font-size:15px;padding:12px 0}.query thead th{font-size:10px;min-block-size:48px;padding:7px 0}.query .in-scope{box-shadow:inset 0 3px var(--focus)}.empty{padding:22px;text-align:center}.bottomlinks{display:flex;gap:5px;flex-wrap:wrap;font-size:11px;margin:8px 0}.bottomlinks button,.bottomlinks a{font-size:11px;min-block-size:44px;display:inline-flex;align-items:center;padding:6px 9px}.bottomlinks a{color:#36586e}.legend{font-size:11px;line-height:1.8;padding:6px 0 10px}.skip{position:absolute;inset-inline-start:8px;inset-block-start:-100px;background:white;padding:12px;z-index:30}.skip:focus{inset-block-start:4px}dialog{border:0;border-radius:12px;inline-size:calc(100% - 20px);max-inline-size:500px;max-block-size:88vh;max-block-size:88dvh;color:inherit;padding:16px;box-shadow:0 10px 50px #142f4a40}dialog[open]{display:block}dialog:modal{overscroll-behavior:contain}dialog::backdrop{background:#152b3ea8;overflow:hidden;overscroll-behavior:contain}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px}.dialoghead h2{margin:0}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:13px;font-weight:600}.field select,.field input{width:100%}.check{display:flex;min-block-size:44px;align-items:center;gap:7px;font-size:13px}input[type=checkbox]{inline-size:23px;block-size:23px;accent-color:var(--ink)}.identity-note{background:#f0f5f8;border-radius:6px;padding:9px;font-size:12px}.dialog-scroll{max-block-size:42vh;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:7px}.dialog-scroll th,.dialog-scroll td{padding:7px;min-block-size:44px}.dialog-scroll table{font-size:12px}.person-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:6px;padding:5px}.person-row strong{font-size:12px}.person-row .choices{flex-wrap:nowrap}.person-row .choices button{min-inline-size:44px;padding:2px;flex:0}.comment{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}textarea{width:100%;min-block-size:90px;font-size:16px;border:1px solid var(--line);border-radius:6px;padding:8px}.status{font-size:12px;min-block-size:20px;color:#325d46;margin:5px 0}.sr-only{position:absolute;clip-path:inset(50%);inline-size:1px;block-size:1px;overflow:hidden;white-space:nowrap}button:not(:disabled):active{transform:translateY(1px)}.note{font-size:12px;background:#f5f0e4;padding:8px;border-radius:5px}details summary{min-block-size:44px;display:flex;align-items:center;font-size:12px;cursor:pointer}@container workspace (inline-size > 650px){.toolbar label{flex:0 1 auto}.scroll{max-block-size:65vh}.dock{max-inline-size:650px;margin-inline:auto}}@container workspace (inline-size < 340px){.view-title{flex-wrap:wrap}.toolbar label{flex:1 1 130px}.actions{align-items:stretch}.actions button{flex:1}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media(forced-colors:active){.activecell{outline:3px solid Highlight}.draft{outline:2px dashed LinkText}.choices [aria-pressed=true]{outline:3px solid Highlight}}
</style>

<body>
<a class="skip" href="#board-title">表へ進む</a>
<header><h1>UnionBoard<small>TMU 練習予定・出欠</small></h1><button id="identity">回答する人を選択</button></header>
<p class="sample">端末内だけの試作｜12日程・40人。他人の回答はサンプル。</p>
<main>
<nav class="concepts" aria-label="改訂案の比較"><button data-view="table">1 全員の原表</button><button data-view="compare">2 比べる列</button><button data-view="query">3 条件で探す</button></nav>
<div id="view"></div>
<div id="dock"></div>
<p class="status" id="status" role="status"></p>
<div class="bottomlinks"><button id="inspect">人を探す・12回を見る</button><button id="clear-identity">対象の記憶を解除</button><button id="reset">試作を初期化</button><a href="./DESIGN.md">設計と検証</a><a href="../index.html">前回の3案</a></div>
<p class="legend">○ 出席　△ 遅刻/早退　× 欠席　- 未定・未回答<br>集計の0件は「-」。本人確認・ログインは行いません。</p>
</main>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialoghead"><h2 id="modal-title"></h2><button id="modal-close" autofocus>閉じる</button></div><div id="modal-body"></div></dialog>
<script>
'use strict';
const parts=[['Fl',4],['Cl',8],['Sax',3],['Hr',6],['Tp',5],['Tb',6],['Bass',4],['Perc',4]];
const people=parts.flatMap(([part,n])=>Array.from({length:n},(_,i)=>({id:part+(i+1),part,name:part==='Tp'&&i===0?'山田':part+(i+1)})));
const dates=[['11/21–23','秋合宿'],['11/28','練習'],['12/13','練習'],['12/19','練習'],['12/26','練習'],['1/9','練習'],['1/23','練習'],['1/31','練習'],['2/6','リハーサル'],['2/14','ゲネプロ'],['2/20','練習'],['2/27','第4回定期演奏会']];
const marks=['○','△','×','-'],words=['出席','遅刻/早退','欠席','未定'],colors=['yes','late','no','unknown'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=p=>p.id==='Tp1'?'山田（Tp）':p.name,member=id=>people.find(p=>p.id===id),index=id=>people.findIndex(p=>p.id===id),key=(e,id)=>`${e}:${id}`,cls=v=>colors[marks.indexOf(v)];
function initial(){return {values:dates.map((_,e)=>people.map((p,i)=>p.id==='Tp1'?(e>=8&&e<=10?'-':'○'):e===1&&p.part==='Hr'?'×':e===1&&p.part==='Bass'?(i%2?'-':'△'):e===8&&p.part==='Perc'?'-':marks[(e*11+i*7)%17<10?0:(e*11+i*7)%17<12?1:(e*11+i*7)%17<15?2:3])),comments:dates.map((_,e)=>e===1?[{id:'Cl3',text:'15時に早退予定です。（サンプル）'}]:[])};}
let data=initial(),self=null,storage=true,view=['table','compare','query'].includes(location.hash.slice(1))?location.hash.slice(1):'table',cursor=8,drafts={},columns=['Cl3','Hr2','Tp2'],queryMark='×',queryMin=3,queryDate='all',queryPart='all',rawPart='all',commentDrafts={};
try{const stored=JSON.parse(localStorage.getItem('unionboard:v2:answers'));if(stored?.values?.length===12&&stored.values.every(r=>r.length===40&&r.every(v=>marks.includes(v)))&&stored.comments?.length===12)data=stored;const saved=localStorage.getItem('unionboard:v2:person');self=member(saved)?saved:null;}catch{storage=false;}
const value=(e,id)=>Object.hasOwn(drafts,key(e,id))?drafts[key(e,id)]:data.values[e][index(id)];
function persist(){try{localStorage.setItem('unionboard:v2:answers',JSON.stringify(data));}catch{storage=false;}}
function tell(s){$('#status').textContent=s;}
function count(e,part){return marks.map(v=>people.filter(p=>(!part||p.part===part)&&value(e,p.id)===v).length);}
function zero(e){return parts.filter(([p])=>count(e,p)[0]===0).map(([p])=>p);}
function options(selected,all=false){return (all?'<option value="all">全パート</option>':'')+parts.map(([p,n])=>`<option value="${p}" ${p===selected?'selected':''}>${p} ${n}人</option>`).join('');}
function dateLabel(e){return `${dates[e][0]} ${dates[e][1]}`;}
function eventButton(e){return `<button data-event="${e}" aria-label="${dateLabel(e)} 詳細とコメント">${dates[e][0]}<br><small>${dates[e][1]==='第4回定期演奏会'?'定期演奏会':dates[e][1]}</small></button>`;}
function warning(){return `<div class="warning"><button data-event="1"><b>次回練習 11/28</b>　○ゼロ：${zero(1).join('・')||'なし'}　<span aria-hidden="true">›</span></button></div>`;}
function cell(e,id){const v=value(e,id),isSelf=self===id;return `<td class="${cls(v)} ${isSelf&&cursor===e?'activecell':''} ${Object.hasOwn(drafts,key(e,id))?'draft':''}" data-cell="${key(e,id)}">${isSelf?`<button data-cursor="${e}" aria-label="${dateLabel(e)} ${label(member(id))} ${v}を編集">${v}</button>`:`<span class="symbol">${v}</span>`}</td>`;}
function raw(){const ps=people.filter(p=>rawPart==='all'||p.part===rawPart);return `<div class="view-title"><h2 id="board-title" tabindex="-1">全員の原表</h2><span class="muted">日程 × 人</span></div><div class="toolbar"><label for="raw-part">パート<select id="raw-part">${options(rawPart,true)}</select></label><button id="raw-pending">次の未定へ</button><button id="locate">回答対象の列へ</button></div>${warning()}<p class="hint">表を横に送る。選択した人のセルだけ押せます。回答は下の操作帯へ。</p><div class="scroll" id="raw-scroll" tabindex="0" role="region" aria-label="12日程と40人の原表"><table class="raw"><caption>○△×-の480回答。日程列と名前行を固定。</caption><thead><tr><th scope="col">日程</th>${ps.map(p=>`<th scope="col" class="member ${self===p.id?'minehead':''}" data-column="${p.id}"><button data-person="${p.id}">${p.name}<br>${p.part}</button></th>`).join('')}</tr></thead><tbody>${dates.map((_,e)=>`<tr><th scope="row">${eventButton(e)}</th>${ps.map(p=>cell(e,p.id)).join('')}</tr>`).join('')}</tbody></table></div>`;}
function comparison(){return `<div class="view-title"><h2 id="board-title" tabindex="-1">比べる人を、列に置く</h2><button id="add-self" style="font-size:12px">回答対象を列に入れる</button></div>${warning()}<p class="hint">各列の名前で40人から選択。パートを越えて3人×全12回を比較。${self&&!columns.includes(self)?'回答対象は今の比較列に含まれていません。':''}</p><div class="scroll" id="compare-scroll" tabindex="0" role="region" aria-label="選んだ3人と全12日程"><table class="compare"><caption>同じ人を複数列に選ぶこともできます。薄青の見出しが回答対象。</caption><thead><tr><th scope="col">日程</th>${columns.map((id,c)=>`<th scope="col" class="${self===id?'minehead':''}"><label class="col-label" for="column-${c}">比較する人 ${c+1}</label><select id="column-${c}" data-compare="${c}">${people.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${label(p)}</option>`).join('')}</select></th>`).join('')}</tr></thead><tbody>${dates.map((_,e)=>`<tr><th scope="row">${eventButton(e)}</th>${columns.map(id=>cell(e,id)).join('')}</tr>`).join('')}</tbody></table></div>`;}
function query(){const es=queryDate==='all'?dates.map((_,i)=>i):[+queryDate];const ps=people.filter(p=>(queryPart==='all'||p.part===queryPart)&&es.filter(e=>value(e,p.id)===queryMark).length>=queryMin);return `<div class="view-title"><h2 id="board-title" tabindex="-1">条件に合う人だけ、読む</h2><strong style="font-size:13px">${ps.length} / 40人</strong></div><div class="toolbar"><label for="query-date">範囲<select id="query-date"><option value="all">全12回</option>${dates.map((d,e)=>`<option value="${e}" ${String(e)===queryDate?'selected':''}>${d.join(' ')}</option>`).join('')}</select></label><label for="query-part">パート<select id="query-part">${options(queryPart,true)}</select></label></div><div class="toolbar"><label for="query-mark">状態<select id="query-mark">${marks.map((v,i)=>`<option value="${v}" ${v===queryMark?'selected':''}>${v} ${words[i]}</option>`).join('')}</select></label><label for="query-min">回数<select id="query-min">${[1,2,3,4].map(n=>`<option value="${n}" ${n===queryMin?'selected':''}>${n}回以上</option>`).join('')}</select></label><button id="query-reset">条件を戻す</button></div><p class="hint">全12日程を残して名簿を絞り込み。セルは表示専用。${self&&!ps.some(p=>p.id===self)?'回答対象はこの条件に一致していません。':''}</p><div class="scroll" id="query-scroll" tabindex="0" role="region" aria-label="条件に一致した人の全12日程">${ps.length?`<table class="query"><caption>${queryDate==='all'?'全12回':dateLabel(+queryDate)}で${queryMark}が${queryMin}回以上の人。未定と未回答は区別しません。</caption><thead><tr><th scope="col">人／該当回数</th>${dates.map((d,e)=>`<th scope="col" class="${es.includes(e)?'in-scope':''}">${d[0]}</th>`).join('')}</tr></thead><tbody>${ps.map(p=>`<tr><th scope="row" class="${p.id===self?'minehead':''}"><button data-person="${p.id}">${p.name} / ${p.part}<br><small>${es.filter(e=>value(e,p.id)===queryMark).length}回</small></button></th>${dates.map((_,e)=>`<td class="${cls(value(e,p.id))}">${value(e,p.id)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="empty">該当者はいません。<br>範囲・状態・回数を変えてください。</p>'}</div>`;}
function renderDock(){if(!self){$('#dock').innerHTML='<div class="dock"><div class="dock-heading"><strong>まずは閲覧だけでも使えます</strong></div><button class="primary" id="choose-from-dock">回答する人を選ぶ</button><span class="muted">　ログイン不要</span></div>';return;}const n=Object.keys(drafts).length,v=value(cursor,self);$('#dock').innerHTML=`<div class="dock"><div class="dock-heading"><strong>${label(member(self))} ／ ${dateLabel(cursor)}</strong><select id="edit-date" aria-label="回答する日程">${dates.map((d,e)=>`<option value="${e}" ${cursor===e?'selected':''}>${d[0]}</option>`).join('')}</select></div><div class="choices" role="group" aria-label="${dateLabel(cursor)} ${label(member(self))} の回答">${marks.map((m,i)=>`<button id="answer-${i}" data-answer="${m}" class="${colors[i]}" aria-label="${m} ${words[i]}" aria-pressed="${v===m}">${m}</button>`).join('')}</div><div class="actions"><button id="pending">次の未定へ</button><span>${n?`${n}件 下書き`:'保存済み'}</span><button id="discard" ${n?'':'disabled'}>取消</button><button id="save" class="primary" ${n?'':'disabled'}>端末内に保存</button></div></div>`;}
function fitTable(){const box=$(".scroll"),dock=$("#dock");if(box&&dock)box.style.maxBlockSize=Math.max(180,(window.visualViewport?.height||innerHeight)-(box.getBoundingClientRect().top+window.scrollY)-dock.getBoundingClientRect().height-16)+"px";}
function render(preserve=true){const el=$('.scroll'),pos=el?{left:el.scrollLeft,top:el.scrollTop}:null,focused=document.activeElement?.id;$('#view').innerHTML=view==='table'?raw():view==='compare'?comparison():query();renderDock();$('#identity').textContent=self?`回答対象：${label(member(self))}　変更`:'回答する人を選択';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));requestAnimationFrame(fitTable);document.title=`${{table:'全員の原表',compare:'比べる列',query:'条件で探す'}[view]}｜UnionBoard試作`;if(pos&&preserve){$('.scroll').scrollLeft=pos.left;$('.scroll').scrollTop=pos.top;}if(focused&&document.getElementById(focused))document.getElementById(focused).focus({preventScroll:true});}
function show(title,body){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal').showModal();}
function dirty(){if(Object.keys(drafts).length||Object.keys(commentDrafts).length){tell('回答の下書き、またはコメントの入力を保存・取消してから回答対象を変更してください。');return true;}return false;}
function choosePerson(id=null){if(dirty())return;show('誰の回答を編集しますか？',`<p class="identity-note">ログインではありません。選んだ人の出欠を編集するための設定です。閲覧には選択不要です。</p><div class="field"><label for="identity-part">パートで探す</label><select id="identity-part">${options('all',true)}</select></div><div class="field"><label for="identity-person">既存のメンバー（パートも確認）</label><select id="identity-person"><option value="">選んでください</option>${people.map(p=>`<option value="${p.id}" ${id===p.id?'selected':''}>${label(p)}</option>`).join('')}</select></div><label class="check" for="remember"><input id="remember" type="checkbox" checked>この端末で回答対象を覚える</label><p class="muted">共有端末ではチェックを外してください。別端末では選び直し。端末の記憶を消すと解除されます。</p><button id="confirm-person" class="primary" ${id?'':'disabled'}>この人の回答を編集</button><details><summary>名簿に見つからない場合</summary><p class="muted">本番ではメンバー登録を別操作にします。この比較試作では40人の既存名簿から選択します。選択しただけで新しい人を作ることはありません。</p></details>`);}
function activate(id,remember){self=id;try{if(remember)localStorage.setItem('unionboard:v2:person',id);else localStorage.removeItem('unionboard:v2:person');}catch{storage=false;}if(!columns.includes(id))columns[0]=id;rawPart='all';const next=dates.findIndex((_,e)=>value(e,id)==='-');cursor=next<0?1:next;render(false);locate();tell(`${label(member(id))}の回答を編集します。${remember&&storage?'この端末で記憶しました。':'今回は記憶しません。'}`);}
function locate(){if(!self){choosePerson();return;}if(view==='table'&&rawPart!=='all'&&rawPart!==member(self).part){rawPart='all';render(false);}const cells=[...document.querySelectorAll('[data-cell]')],target=cells.find(el=>el.dataset.cell===key(cursor,self));if(target)requestAnimationFrame(()=>{fitTable();target.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'});});}
function nextPending(){if(!self){choosePerson();return;}const order=dates.map((_,j)=>(cursor+1+j)%dates.length);const n=order.find(e=>value(e,self)==='-');if(n===undefined){tell('未定はありません。日程を選べば回答を変更できます。');return;}cursor=n;render();locate();tell(`${dateLabel(cursor)}を選択しました。`);}
function setAnswer(v){if(!self)return;const k=key(cursor,self);if(data.values[cursor][index(self)]===v)delete drafts[k];else drafts[k]=v;const pending=dates.map((_,j)=>(cursor+1+j)%dates.length).find(e=>e!==cursor&&value(e,self)==='-');const previous=cursor;if(pending!==undefined)cursor=pending;render();locate();tell(`${label(member(self))}の${dates[previous][0]}を${v}に下書き。${pending!==undefined?'次の未定へ移動。':''}保存すると端末内に反映されます。`);}
function save(){for(const [k,v]of Object.entries(drafts)){const [e,id]=k.split(':');data.values[+e][index(id)]=v;}const n=Object.keys(drafts).length;drafts={};persist();render();tell(storage?`${n}件を端末内に保存しました。本番は変更していません。`:'端末内保存が利用できません。この画面を閉じると変更は失われます。');}
function personDetail(id){const p=member(id);show(`${label(p)}の全12回`,`<p class="muted">出欠の閲覧は本人の選択なしでできます。</p><div class="dialog-scroll" tabindex="0" role="region" aria-label="${label(p)}の12回"><table><caption>${label(p)}の出欠</caption><thead><tr><th scope="col">日程</th><th scope="col">回答</th></tr></thead><tbody>${dates.map((d,e)=>`<tr><th scope="row">${d.join(' ')}</th><td class="${cls(value(e,id))}">${value(e,id)}</td></tr>`).join('')}</tbody></table></div><button id="edit-person" data-id="${id}" class="primary">この人の回答を編集</button>`);}
function inspect(){show('人を探す・12回を見る',`<div class="field"><label for="find-name">名前またはパート</label><input type="search" id="find-name" placeholder="例：Cl3、山田、Tp"></div><div class="dialog-scroll" id="people-list">${people.map(p=>`<div class="person-row" data-search="${label(p)}"><strong>${label(p)}</strong><button data-inspect="${p.id}">12回を見る</button></div>`).join('')}</div>`);}
function eventDetail(e){show(`${dateLabel(e)}｜詳細`, `<p class="note">○ゼロ：${zero(e).join('・')||'なし'}。△や-がいる場合、「全員欠席」とは限りません。</p><div class="dialog-scroll" tabindex="0" role="region" aria-label="パート別内訳"><table><caption>パート別内訳。0件は「-」。下書きも含む。</caption><thead><tr><th scope="col">パート</th>${marks.map(v=>`<th scope="col">${v}</th>`).join('')}</tr></thead><tbody>${parts.map(([p])=>`<tr><th scope="row">${p}</th>${count(e,p).map(n=>`<td>${n||'-'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3 id="comment-heading">コメント ${data.comments[e].length}件</h3><div id="comments">${data.comments[e].map(c=>`<p class="comment"><b>${esc(label(member(c.id)))}</b><br>${esc(c.text)}</p>`).join('')||'<p class="muted">コメントなし</p>'}</div>${self?`<label for="comment">${label(member(self))}のコメント（任意）</label><textarea id="comment" data-comment-event="${e}" maxlength="500">${esc(commentDrafts[key(e,self)]??data.comments[e].find(c=>c.id===self)?.text??" ").trim()}</textarea><button data-comment-save="${e}">端末内にコメントを保存</button><button data-comment-discard="${e}">入力を戻す</button><p class="muted">入力途中は閉じても保持します。保存して確定。</p><p class="status" id="comment-status" role="status"></p>`:'<p class="muted">コメントを書くときも、先に回答する人を選びます。</p>'}`);}
function reset(){drafts={};commentDrafts={};data=initial();persist();cursor=8;rawPart='all';columns=['Cl3','Hr2','Tp2'];if(self)columns[0]=self;queryMark='×';queryMin=3;queryDate='all';queryPart='all';render(false);tell('試作の回答・コメントを初期化しました。回答対象の記憶は維持しています。');}
function changeView(v){view=v;history.replaceState(null,'','#'+view);render(false);tell('');}
 document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;const d=b.dataset;if(d.view)changeView(d.view);else if(b.id==='identity'||b.id==='choose-from-dock')choosePerson(self);else if(d.cursor!==undefined){cursor=+d.cursor;render();}else if(d.answer)setAnswer(d.answer);else if(d.person)personDetail(d.person);else if(d.inspect){$('#modal').close();personDetail(d.inspect);}else if(d.event!==undefined)eventDetail(+d.event);else if(b.id==='modal-close')$('#modal').close();else if(b.id==='confirm-person'){const id=$('#identity-person').value,remember=$('#remember').checked;if(!member(id))return;$('#modal').close();activate(id,remember);}else if((b.id==='pending'||b.id==='raw-pending'))nextPending();else if(b.id==='locate')locate();else if(b.id==='save')save();else if(b.id==='discard'){drafts={};render();tell('下書きを取り消しました。');}else if(b.id==='inspect')inspect();else if(b.id==='add-self'){if(!self)choosePerson();else{columns[0]=self;render(false);locate();}}else if(b.id==='edit-person'){const id=d.id;$('#modal').close();choosePerson(id);}else if(b.id==='clear-identity'){if(dirty())return;self=null;try{localStorage.removeItem('unionboard:v2:person');}catch{storage=false;}render();tell('回答対象の記憶を解除しました。出欠データは消していません。');}else if(b.id==='reset')reset();else if(b.id==='query-reset'){queryMark='×';queryMin=3;queryDate='all';queryPart='all';render(false);}else if(d.commentDiscard!==undefined){delete commentDrafts[key(+d.commentDiscard,self)];$('#comment').value=data.comments[+d.commentDiscard].find(c=>c.id===self)?.text||'';}else if(d.commentSave!==undefined){const e=+d.commentSave,text=$('#comment').value.trim();if(!text){$('#comment-status').textContent='コメントを入力してください。';return;}const existing=data.comments[e].find(c=>c.id===self);if(existing)existing.text=text;else data.comments[e].push({id:self,text});persist();delete commentDrafts[key(e,self)];$('#comment-heading').textContent=`コメント ${data.comments[e].length}件`;$('#comments').replaceChildren(...data.comments[e].map(c=>{const p=document.createElement('p');p.className='comment';p.textContent=label(member(c.id))+'：'+c.text;return p;}));$('#comment').value='';$('#comment-status').textContent=storage?'端末内に保存しました。':'この画面内だけの変更です。';}});
 document.addEventListener('change',event=>{const t=event.target;if(t.id==='identity-part'){const chosen=$('#identity-person').value;$('#identity-person').innerHTML='<option value="">選んでください</option>'+people.filter(p=>t.value==='all'||p.part===t.value).map(p=>`<option value="${p.id}">${label(p)}</option>`).join('');$('#confirm-person').disabled=true;}else if(t.id==='identity-person')$('#confirm-person').disabled=!member(t.value);else if(t.id==='edit-date'){cursor=+t.value;render();locate();}else if(t.dataset.compare!==undefined){columns[+t.dataset.compare]=t.value;render();}else if(t.id==='raw-part'){rawPart=t.value;render(false);}else if(t.id==='query-date'){queryDate=t.value;if(queryDate!=='all')queryMin=1;render(false);}else if(t.id==='query-part'){queryPart=t.value;render(false);}else if(t.id==='query-mark'){queryMark=t.value;render(false);}else if(t.id==='query-min'){queryMin=+t.value;render(false);}});
 document.addEventListener('input',event=>{if(event.target.id==='comment'){commentDrafts[key(+event.target.dataset.commentEvent,self)]=event.target.value;}else if(event.target.id==='find-name'){const q=event.target.value.toLowerCase();document.querySelectorAll('[data-search]').forEach(row=>row.hidden=!row.dataset.search.toLowerCase().includes(q));}});
if(self){columns[0]=self;const first=dates.findIndex((_,e)=>value(e,self)==='-');cursor=first<0?1:first;}window.addEventListener("resize",fitTable);window.visualViewport?.addEventListener("resize",fitTable);
render(false);if(self)locate();
</script>
</body></html>
