<style>
:root{font:14px system-ui,'Yu Gothic',sans-serif;color:#203739;background:#f4f2ec;--line:#d4ded8;--ink:#164d4e}*{box-sizing:border-box}body{margin:0}button,select,textarea{font:inherit}button,select{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:6px;background:white;color:inherit;padding:5px 9px}button{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #1687a0;outline-offset:2px}button[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--ink);font-weight:bold}button:disabled{opacity:.45;cursor:default}header{background:var(--ink);color:white;padding:18px 14px}header small{letter-spacing:.15em;color:#bfd8d1}h1{font-size:23px;margin:5px 0}h2{font-size:21px;margin:14px 0 6px}h3{font-size:16px}p{line-height:1.65;margin:8px 0}main{max-width:850px;margin:auto;padding:0 12px 36px}.notice{background:#f7e8c6;padding:8px 12px;font-size:12px;margin:0}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:12px 0}.modes button{font-size:12px;font-weight:bold}.modes [aria-pressed=true],.primary{background:var(--ink);color:white}small,.muted{font-size:12px;color:#53686b}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:10px 0}.toolbar label{display:flex;align-items:center;gap:6px}select{max-width:100%}.summary{background:white;border-left:4px solid #bc6946;padding:10px;margin:12px 0}.summary strong{display:block}.tag{display:inline-block;border-radius:4px;padding:3px 6px;margin:2px}.yes{background:#d6eadb;color:#16482a}.late{background:#ffedb0;color:#614900}.no{background:#f4d2db;color:#6b2138}.unknown{background:#e5e9ed;color:#485562}.scroll{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:8px;background:white;overscroll-behavior:contain}table{border-spacing:0;border-collapse:separate;background:white;width:100%;font-size:12px}caption{text-align:left;padding:7px;color:#53686b}th,td{height:48px;text-align:center;padding:4px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}thead th{position:sticky;top:0;background:#e4eee7;z-index:4}tbody th{background:#f8faf7}td button,th button{padding:4px}.event{position:sticky;left:0;background:white;min-width:86px;max-width:86px;z-index:2}.event button{width:76px;font-size:12px}.self{position:sticky;left:86px;min-width:188px;background:#eaf4ed;z-index:2}.choices{display:flex;gap:4px}.choices button{font-size:18px;min-height:44px;min-width:44px;padding:2px}.self .choices{gap:2px}.self .choices button{width:44px}.matrix thead .self,.matrix thead .event{z-index:6;background:#d9e8df}.matrix .person{min-width:44px}.person button{font-size:11px}.dot{font-size:18px;font-weight:bold}.shelf{padding:10px;background:white;border:1px solid var(--line);border-radius:8px}.selfline{display:flex;align-items:center;justify-content:space-between;gap:4px;border-bottom:1px solid var(--line);padding:5px 0}.selfline>span{font-size:12px;min-width:75px}.windowtable{table-layout:fixed}.windowtable th:first-child{width:92px;position:sticky;left:0;z-index:2}.windowtable thead th:first-child{z-index:6}.windowtable .group th{background:#dceae2;text-align:left;height:32px}.windowtable td{font-size:20px}.windowtable button{width:100%;font-size:12px}.ledger{table-layout:fixed}.ledger th:first-child{width:86px}.ledger td{text-align:left;vertical-align:top;padding:8px;overflow-wrap:anywhere}.ledger button{font-size:12px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;line-height:1.4}details{margin-top:5px}input[type=checkbox]{width:24px;height:24px;accent-color:var(--ink)}.check{display:flex;align-items:center;justify-content:center;min-height:44px;gap:4px}.batch{position:sticky;bottom:0;background:#fff6df;padding:10px;box-shadow:0 -3px 12px #20373920;border:1px solid #e0cfad;border-radius:8px;margin-top:10px}.batch .toolbar{margin:5px 0}.legend,.foot{font-size:12px;line-height:1.8;margin:14px 0}.question{padding:10px;background:#e4ece5;border-radius:7px}dialog{border:0;border-radius:12px;width:calc(100% - 24px);max-width:480px;max-height:88vh;padding:16px;color:inherit}dialog::backdrop{background:#17363aaa}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px}dialog .scroll{max-height:40vh}textarea{width:100%;font-size:16px;min-height:88px;padding:10px;border:1px solid var(--line);border-radius:6px}.comment{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 0;border-bottom:1px solid var(--line)}.overview td{min-width:26px;height:28px;padding:2px}.overview thead th{writing-mode:vertical-rl;min-width:26px}.overview .event{min-width:80px}.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);max-width:90vw;z-index:20;background:var(--ink);color:white;padding:10px 16px;border-radius:8px}.toast:empty{display:none}a{color:#17636b}@media(min-width:600px){main{padding:0 24px 40px}.shelf{max-width:600px}.selfline{justify-content:flex-start;gap:20px}}

<header><small>TOKYO MUSIC UNION / DESIGN STUDY</small><h1>次の合奏を、見渡す。</h1><div>UnionBoard スマホ体験の比較試作</div></header><p class="notice">本番と接続しない試作。変更はこの端末内のみ。山田（Tp）以外の回答・コメントはサンプルです。</p>
<main><nav class="modes" aria-label="設計案"><button data-mode="a">案1<br>原表に織り込む</button><button data-mode="b">案2<br>3回を並べる</button><button data-mode="c">案3<br>例外を読む</button></nav><div id="view"></div><div class="legend">○ 出席（緑）　△ 遅刻/早退（黄）<br>× 欠席（赤）　- 未定・未回答（灰）<br>集計のゼロは「-」。○ゼロと全員×は別です。</div><div class="toolbar"><button id="overview">全体表 12×40</button><button id="person">人を日程横断で見る</button><button id="reset">この案を初期化</button></div><p class="question" id="question"></p><p class="foot">想定本人：山田（Tp）／指揮者。ログイン・本人認証はありません。案ごとに別の端末内データを保持。保存不可のブラウザでは開いている間だけ保持します。</p></main>
<dialog id="detail"><div class="dialoghead"><h2 id="detail-title"></h2><button id="close">閉じる</button></div><div id="detail-body"></div></dialog><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const parts=[['Fl',4],['Cl',8],['Sax',3],['Hr',6],['Tp',5],['Tb',6],['Bass',4],['Perc',4]];
const members=parts.flatMap(([p,n])=>Array.from({length:n},(_,i)=>({id:p+(i+1),part:p,name:p==='Tp'&&i===0?'山田（Tp）':p+(i+1)})));
const events=[['11/21–23','秋合宿'],['11/28','練習'],['12/13','練習'],['12/19','練習'],['12/26','練習'],['1/9','練習'],['1/23','練習'],['1/31','練習'],['2/6','リハーサル'],['2/14','ゲネプロ'],['2/20','練習'],['2/27','第4回定期演奏会']];
const mine=members.findIndex(m=>m.id==='Tp1'),marks=['○','△','×','-'],names=['出席','遅刻/早退','欠席','未定'],classes=['yes','late','no','unknown'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode=['a','b','c'].includes(location.hash.slice(1))?location.hash.slice(1):'a',state,range=0,selected=new Set(),batchMark='○',personIndex=mine,partFilter='all',storageOK=true,undo=null,toastTimer;
function seed(){return {values:events.map((_,e)=>members.map((m,i)=>i===mine?(e>=8&&e<=10?'-':'○'):e===1&&m.part==='Hr'?'×':e===1&&m.part==='Bass'?(i%2?'-':'△'):e===8&&m.part==='Perc'?'-':marks[((e*11+i*7)%17)<10?0:((e*11+i*7)%17)<12?1:((e*11+i*7)%17)<15?2:3])),comments:events.map((_,e)=>e===1?[{name:'Cl3（サンプル）',text:'15時に早退予定です。'}]:[])};}
function load(){try{const s=JSON.parse(localStorage.getItem('unionboard-study-v1-'+mode));state=s&&s.values?.length===12&&s.values.every(r=>r.length===40&&r.every(v=>marks.includes(v)))&&s.comments?.length===12?s:seed();}catch{state=seed();storageOK=false;}}
function persist(){try{localStorage.setItem('unionboard-study-v1-'+mode,JSON.stringify(state));}catch{storageOK=false;}}
function badge(v){return `<span class="tag ${classes[marks.indexOf(v)]}">${v}</span>`;}
function count(e,p){const ids=members.map((m,i)=>[m,i]).filter(([m])=>!p||m.part===p);return marks.map(v=>ids.filter(([,i])=>state.values[e][i]===v).length);}
function fmt(n){return n||'-';}function zeros(e){return parts.filter(([p])=>count(e,p)[0]===0).map(([p])=>{const c=count(e,p);return `${p}（×${c[2]}・△${c[1]}・-${c[3]}）`;}).join('、')||'なし';}
function alertline(e=1){return `<div class="summary"><strong>${events[e][0]} ${events[e][1]}｜○がいないパート</strong>${zeros(e)}<p class="muted">○だけで判定。△の滞在時間・-の予定は確認が必要。</p></div>`;}
function choices(e){return `<div class="choices" role="group" aria-label="${events[e][0]} 山田の回答">${marks.map((v,i)=>`<button class="${classes[i]}" aria-pressed="${state.values[e][mine]===v}" data-answer="${e}" data-value="${v}" aria-label="${events[e][0]} ${names[i]}">${v}</button>`).join('')}</div>`;}
function toast(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',2600);}
function answer(e,v){state.values[e][mine]=v;persist();render();toast(`${events[e][0]} を ${v} に変更${storageOK?'（端末内保存）':'（この画面内のみ）'}`);}
function eventButton(e){return `<button data-event="${e}" aria-label="${events[e][0]} ${events[e][1]} コメントと内訳">${events[e][0]}<br>${events[e][1]}<br><small>コメント ${state.comments[e].length}</small></button>`;}
function renderA(){return `<h2>表から、離れずに答える。</h2><p>日程と山田の4ボタンを左に固定。他の40人は右側を横スクロール。</p>${alertline()}<div class="scroll" id="grid"><table class="matrix"><caption>12日程 × 40人。回答欄を原表の同じ行に常設。</caption><thead><tr><th class="event" scope="col">日程・詳細</th><th class="self" scope="col">山田（Tp）<br>そのまま回答</th>${members.map((m,i)=>`<th class="person" scope="col"><button data-person="${i}">${m.name}</button></th>`).join('')}</tr></thead><tbody>${events.map((_,e)=>`<tr><th class="event" scope="row">${eventButton(e)}</th><td class="self">${choices(e)}</td>${members.map((m,i)=>`<td class="dot ${classes[marks.indexOf(state.values[e][i])]}">${state.values[e][i]}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted">回答欄は本人列の複製表示。原表の山田列にも即反映。他のセルは表示専用です。</p>`;}
function windowEvents(){return range===-1?[8,9,10]:[range,range+1,range+2];}
function renderB(){const es=windowEvents();return `<h2>誰が、続けて来られる？</h2><p>3回を横に比較。人は縦に読む。自分の回答も同じ3回にそろえます。</p><div class="toolbar"><button data-window="0">直近3回</button><button data-window="-1" aria-pressed="${range===-1}">2月の未定を確認</button></div><div class="toolbar"><button data-shift="-1" ${range<=0?'disabled':''}>← 前の3回</button><span>${es.map(e=>events[e][0]).join(' / ')}</span><button data-shift="1" ${range>=9?'disabled':''}>次の3回 →</button></div>${alertline(es.includes(1)?1:es[0])}<div class="toolbar"><label>縦に見るパート<select id="part"><option value="all">全40人</option>${parts.map(([p])=>`<option ${p===partFilter?'selected':''}>${p}</option>`).join('')}</select></label></div><div class="scroll"><table class="windowtable"><caption>日程の見出し固定。人名を押すと全12回を確認。</caption><thead><tr><th scope="col">メンバー</th>${es.map(e=>`<th scope="col">${eventButton(e)}</th>`).join('')}</tr></thead><tbody>${parts.filter(([p])=>partFilter==='all'||p===partFilter).map(([p,n])=>`<tr class="group"><th colspan="4">${p} ${n}人｜○人数：${es.map(e=>fmt(count(e,p)[0])).join(' / ')}</th></tr>${members.map((m,i)=>m.part===p?`<tr><th scope="row"><button data-person="${i}">${m.name}</button></th>${es.map(e=>`<td class="${classes[marks.indexOf(state.values[e][i])]}">${state.values[e][i]}</td>`).join('')}</tr>`:'').join('')}`).join('')}</tbody></table></div><div class="shelf" id="my-window"><strong>山田（Tp）｜4ボタンで即回答</strong>${es.map(e=>`<div class="selfline"><span>${events[e][0]}<br>${events[e][1]}</span>${choices(e)}</div>`).join('')}</div>`;}
function renderC(){return `<h2>来られない人から、読む。</h2><p>○をたたみ、×・△・-の人名を残す欠席台帳。○は省略であって推定ではありません。</p>${alertline()}<p class="muted">日程のチェック＝山田の一括回答対象。各行の「全員」で○も確認できます。</p><div class="scroll"><table class="ledger"><caption>12日程の例外一覧（各行を展開できます）</caption><thead><tr><th scope="col">日程／選択</th><th scope="col">○がいないパート・例外の人</th></tr></thead><tbody>${events.map((_,e)=>`<tr><th scope="row">${eventButton(e)}<label class="check"><input type="checkbox" data-check="${e}" aria-label="${events[e][0]}を一括回答に選択" ${selected.has(e)?'checked':''}>山田 ${state.values[e][mine]}</label></th><td><b>○ゼロ：${zeros(e)}</b><div>${marks.map((v,i)=>`<span class="tag ${classes[i]}">${v} ${fmt(count(e)[i])}</span>`).join('')}</div><details><summary>×・△・- の人名（${40-count(e)[0]}人）</summary>${marks.slice(1).map(v=>`<p>${badge(v)} ${members.filter((m,i)=>state.values[e][i]===v).map(m=>m.name).join('、')||'該当なし'}</p>`).join('')}</details><details><summary>全員（○も含む40人）</summary>${parts.map(([p])=>`<p><b>${p}</b> ${members.map((m,i)=>m.part===p?`${esc(m.name)} ${state.values[e][i]}`:'').filter(Boolean).join(' / ')}</p>`).join('')}</details></td></tr>`).join('')}</tbody></table></div><div class="batch"><strong>山田（Tp）の一括回答</strong><div class="toolbar"><button id="pending-select">自分の未定${state.values.filter(r=>r[mine]==='-').length}件を選択</button><span>${selected.size}件選択</span></div><div class="toolbar"><div class="choices">${marks.map((v,i)=>`<button data-batch="${v}" aria-label="一括 ${names[i]}" aria-pressed="${batchMark===v}" class="${classes[i]}">${v}</button>`).join('')}</div><button id="apply" class="primary" ${selected.size?'':'disabled'}>選択へ反映</button></div><small>選択日：${[...selected].sort((a,b)=>a-b).map(e=>events[e][0]).join('、')||'なし'}</small> <button id="undo" ${undo?'':'disabled'}>元に戻す</button></div>`;}
function render(){const grid=$('#grid'),left=grid?.scrollLeft||0,top=grid?.scrollTop||0;$('#view').innerHTML=mode==='a'?renderA():mode==='b'?renderB():renderC();document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('#question').textContent={a:'議論：日程と回答を常設し、他人に使える横幅が狭くてもよい？',b:'議論：12回の同時比較を手放しても、3回×40人のほうが考えやすい？',c:'議論：○を省略した台帳は読みやすい？ 誰が来るかが読めず不安？'}[mode];if($('#grid')){$('#grid').scrollLeft=left;$('#grid').scrollTop=top;}}
function show(title,html){$('#detail-title').textContent=title;$('#detail-body').innerHTML=html;$('#detail').showModal();}
function eventDetail(e){show(`${events[e][0]} ${events[e][1]}`,`<p>○ゼロ：${zeros(e)}</p><div>${marks.map((v,i)=>`<span class="tag ${classes[i]}">${v} ${fmt(count(e)[i])}</span>`).join('')}</div><div class="scroll"><table><thead><tr><th>パート</th>${marks.map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${parts.map(([p])=>`<tr><th scope="row">${p}</th>${count(e,p).map(n=>`<td>${fmt(n)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3>コメント一覧（サンプル／端末内）</h3><div id="comments">${state.comments[e].map(c=>`<div class="comment"><b>${esc(c.name)}</b><br>${esc(c.text)}</div>`).join('')||'<p>コメントなし</p>'}</div><label for="comment">山田（Tp）のコメントを入力（任意）</label><textarea id="comment" maxlength="500" placeholder="例：15時から参加します"></textarea><button class="primary" data-comment="${e}">端末内にコメントを追加</button>`);}
function personDetail(i=personIndex){personIndex=i;show('一人の12回を読む',`<label>メンバー<select id="member-pick">${members.map((m,j)=>`<option value="${j}" ${i===j?'selected':''}>${m.name}</option>`).join('')}</select></label><div class="scroll"><table><thead><tr><th>日程</th><th>${members[i].name}</th></tr></thead><tbody>${events.map((ev,e)=>`<tr><th scope="row">${ev.join(' ')}</th><td class="dot ${classes[marks.indexOf(state.values[e][i])]}">${state.values[e][i]}</td></tr>`).join('')}</tbody></table></div>`);}
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.mode){mode=d.mode;location.hash=mode;selected.clear();undo=null;range=0;batchMark='○';partFilter='all';load();render();}else if(d.answer!==undefined)answer(+d.answer,d.value);else if(d.event!==undefined)eventDetail(+d.event);else if(d.person!==undefined)personDetail(+d.person);else if(d.window!==undefined){range=+d.window;render();if(range===-1)$('#my-window').scrollIntoView({block:'center'});}else if(d.shift){range=Math.max(0,Math.min(9,(range<0?6:range)+3*+d.shift));render();}else if(d.batch){batchMark=d.batch;render();}else if(b.id==='close')$('#detail').close();else if(b.id==='person')personDetail();else if(b.id==='pending-select'){selected=new Set(state.values.flatMap((r,i)=>r[mine]==='-'?[i]:[]));render();}else if(b.id==='apply'){undo=JSON.parse(JSON.stringify(state.values));selected.forEach(i=>state.values[i][mine]=batchMark);const n=selected.size;selected.clear();persist();render();toast(`${n}件を${batchMark}に変更（端末内）`);}else if(b.id==='undo'&&undo){state.values=undo;undo=null;persist();render();toast('一括回答を元に戻しました');}else if(b.id==='reset'){state=seed();selected.clear();undo=null;range=0;batchMark='○';partFilter='all';persist();render();toast('この案のサンプルを初期化しました');}else if(d.comment!==undefined){const text=$('#comment').value.trim();if(!text){toast('コメントを入力してください');return;}state.comments[+d.comment].push({name:'山田（Tp）',text});persist();$('#detail').close();render();eventDetail(+d.comment);toast('コメントを端末内に追加しました');}else if(b.id==='overview'){show('全体表｜12日程 × 40人',`<p>表示専用。横スクロールしても日程は固定。人の詳細はホームの「人を日程横断で見る」から。</p><div class="scroll"><table class="overview"><thead><tr><th class="event">日程</th>${members.map(m=>`<th>${m.name}</th>`).join('')}</tr></thead><tbody>${events.map((ev,e)=>`<tr><th class="event" scope="row">${ev[0]}</th>${state.values[e].map(v=>`<td class="${classes[marks.indexOf(v)]}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);}});
 document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){const i=+e.target.dataset.check;e.target.checked?selected.add(i):selected.delete(i);const top=$('.scroll').scrollTop;render();$('.scroll').scrollTop=top;}else if(e.target.id==='part'){partFilter=e.target.value;render();}else if(e.target.id==='member-pick'){const i=+e.target.value;$('#detail').close();personDetail(i);}});
load();render();
</script></html>
