name: Deploy (dev)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Supabase (dev)
    runs-on: ubuntu-latest
    if: github.actor == 'shotasten'
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Set Supabase secrets
        run: |
          supabase secrets set GOOGLE_SERVICE_ACCOUNT_JSON="$GOOGLE_SERVICE_ACCOUNT_JSON"
          supabase secrets set GOOGLE_CALENDAR_ID="$GOOGLE_CALENDAR_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}

      - name: Verify secrets are set
        run: supabase secrets list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Setup Node.js for keep-alive Worker secrets
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler CLI for secret sync
        run: npm install --global wrangler

      - name: Deploy keep-alive Worker (dev)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/keepalive
          command: deploy --env dev

      - name: Sync keep-alive Worker secrets
        run: |
          printf '%s' "$SUPABASE_URL" | wrangler secret put SUPABASE_URL --env dev
          printf '%s' "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY --env dev
          printf '%s' "$SPACE_ID" | wrangler secret put SPACE_ID --env dev
          printf '%s' "$SUPABASE_KEEPALIVE_TOKEN" | wrangler secret put SUPABASE_KEEPALIVE_TOKEN --env dev
        working-directory: cloudflare/keepalive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SPACE_ID: ${{ vars.VITE_SPACE_ID }}
          SUPABASE_KEEPALIVE_TOKEN: ${{ secrets.SUPABASE_KEEPALIVE_TOKEN }}
