document.addEventListener('click',ev=>{const home=ev.target.closest('.brand-home');if(home){if(ev.ctrlKey||ev.metaKey||ev.shiftKey||ev.altKey)return;ev.preventDefault();$('#dialog').close();detailEvent=null;part=null;expanded=null;history.pushState({},'', '#schedule');render();window.scrollTo(0,0);return;}const b=ev.target.closest('button');if(!b)return;if(b.dataset.memberTool){openAdmin(b.dataset.memberTool==='register'?'add-member':self?'edit-member':'members',b.dataset.memberTool==='register'?null:self);}else if(b.id==='admin-preview-open')openAdmin(adminPreview?'admins':'login');else if(b.dataset.admin)openAdmin(b.dataset.admin,b.dataset.member??(detailEvent!==null?detailEvent:null));else if(b.dataset.adminResult){show('表示確認', '<p>確認しました。試作のため操作は実行していません。</p><p class="muted">元のメンバー・予定・権限は変わりません。</p>');}});
const lightDialog=$('#dialog');if(!('closedBy' in HTMLDialogElement.prototype)){let outsideDown=false;const outside=ev=>{const r=lightDialog.getBoundingClientRect();return ev.target===lightDialog&&(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom);};lightDialog.addEventListener('pointerdown',ev=>outsideDown=outside(ev));lightDialog.addEventListener('click',ev=>{if(outsideDown&&outside(ev))lightDialog.close();outsideDown=false;});}
function render(){renderAdminStrip();const pending=self?events.filter((_,e)=>get(e,self)==='-').length:0;$('#identity-button').textContent=self?`回答対象：${name(self)}　変更`:'自分を選ぶ';document.title=detailEvent!==null?`${eventName(detailEvent)}｜UnionBoard試作`:'予定と自分の回答｜UnionBoard試作';if(detailEvent!==null){$('#app').innerHTML=`<div class="crumb"><button id="back-schedule">← 予定一覧</button></div>${summary(detailEvent)}${commentPreview(detailEvent)}${adminPreview?'<div class="toolbar admin-event-actions"><button data-admin="edit-event">イベント編集</button><button data-admin="sync">同期</button><button data-admin="delete-event" class="danger-text">削除</button></div>':''}${panel(detailEvent)}<p class="status" id="page-status" role="status"></p>`;return;}$('#app').innerHTML=`<div class="heading"><h2 id="schedule-heading" tabindex="-1">予定一覧</h2><span class="muted">12件 · 11月〜2月</span></div>${self?`<div class="toolbar"><strong>${name(self)}</strong><button id="edit-pending">${pending?'未定 '+pending+'件を入力':'全12日程を変更'}</button><button id="edit-all">まとめて変更</button></div>`:''}<div id="draft-notice"></div><p class="status" id="page-status" role="status"></p><ul class="cassettes" aria-label="予定・場所・参加人数・自分の回答">${events.map((ev,e)=>`<li><div class="cassette-wrap" id="event-row-${e}"><a class="cassette" href="#event-${e}" data-open-event="${e}"><span class="cassette-date">${dateCell(e)}</span><span class="cassette-place">${place(e)}</span><span class="cassette-count" data-count="${e}">${countHTML(e)}</span><span class="chevron" aria-hidden="true">›</span></a><button class="cassette-self" data-edit-one="${e}" aria-label="${eventName(e)} ${self?name(self)+'の出欠を編集':'回答する人を選択'}"><span class="self-label">自分</span><span data-self="${e}" class="self-button ${self?statusClass(get(e,self)):'unselected'}">${self?get(e,self):'未選択'}</span><span class="edit-hint">変更</span></button></div></li>`).join('')}</ul><p class="legend">参加予定＝○出席＋△遅刻/早退。同時に全員が揃うとは限りません。<br>日程・場所・人数から詳細へ。「自分」は回答の選択・変更へ。</p><div class="links"><bu function refresh(){document.querySelectorAll('[data-roster-count]').forEach(el=>{const [e,p]=el.dataset.rosterCount.split(':');el.textContent='○'+fmt(count(+e,p)[0])+' · △'+fmt(count(+e,p)[1]);});document.querySelectorAll('[data-count]').forEach(b=>{const e=+b.dataset.count;b.innerHTML=countHTML(e);if(b.matches('button'))b.setAttribute('aria-label',countLabel(e));});document.querySelectorAll('[data-self]').forEach(b=>{const e=+b.dataset.self;if(self){b.textContent=get(e,self);b.className='self-button '+statusClass(get(e,self));b.setAttribute('aria-label',`${eventName(e)} ${name(self)}の回答 ${get(e,self)} を編集`);}});document.querySelectorAll('[data-summary]').forEach(el=>{const[e,i]=el.dataset.summary.split(':').map(Number);el.textContent=`${marks[i]} ${fmt(count(e)[i])}人`;});if($('#edit-pending')&&self){const n=events.filter((_,e)=>get(e,self)==='-').length;$('#edit-pending').textContent=n?'未定 '+n+'件を入力':'全12日程を変更';}document.querySelectorAll('[data-partstat]').forEach(el=>{const[e,p,i]=el.dataset.partstat.split(':');const n=count(+e,p)[+i];el.textContent=marks[+i]+' '+fmt(n);el.setAttribute('aria-label',words[+i]+' '+n+'人');});document.querySelectorAll('[data-member-status]').forEach(el=>{const[e,id]=el.dataset.memberStatus.split(':');const v=get(+e,id);el.className='answer '+statusClass(v);el.textContent=v+' '+words[marks.indexOf(v)];});document.querySelectorAll('[data-comment-preview]').forEach(el=>el.innerHTML=commentPreviewBody(+el.dataset.commentPreview));}

window.addEventListener('popstate',()=>{const m=location.hash.match(/^#event-(\d+)$/);detailEvent=m&&+m[1]<12?+m[1]:null;part=null;render();requestAnimationFrame(()=>{window.scrollTo(0,detailEvent===null?returnScroll:0);if(detailEvent===null&&returnEvent!==null)$('[data-open-event="'+returnEvent+'"]')?.focus({preventScroll:true});});});
function editorEvents(scope){if(Array.isArray(scope))return scope;const es=scope==='pending'?events.flatMap((_,e)=>get(e,self)==='-'?[e]:[]):events.map((_,e)=>e);return es.length?es:events.map((_,e)=>e);}
function openEditor(scope){if(!self){choosePerson({type:'edit',scope});return;}const es=editorEvents(scope);editor={id:self,scope,events:es};show(`${name(self)}の出欠`,`<p class="muted">日程・場所・全体人数を確認して回答。保存は端末内だけ。</p><div class="editor-filter"><button data-editor-scope="pending" aria-pressed="${scope==='pending'}">未定の日程</button><button data-editor-scope="all" aria-pressed="${scope==='all'}">全12日程</button><span class="muted">表示 ${es.length}件</span></div>${es.map(e=>`<fieldset class="editor-row ${Object.hasOwn(drafts,e)?'changed':''}" data-fieldset="${e}"><legend>${events[e].date}（${events[e].week}） ${events[e].title}</legend><div class="editor-meta"><strong>${events[e].building} ${events[e].room}<br>${events[e].time}</strong><span data-preview="${e}">人数 ○${fmt(count(e,null,true)[0])}／△${fmt(count(e,null,true)[1])}</span></div><div class="choices" role="group" aria-label="${eventName(e)} ${name(self)}の回答">${marks.map((v,i)=>`<button data-input-event="${e}" data-input-value="${v}" class="${styles[i]}" aria-pressed="${get(e,self,true)===v}" aria-label="${events[e].date} ${v} ${words[i]}">${v}<small>${words[i]}</small></button>`).join('')}</div></fieldset>`).join('')}`,'<span id="edit-change-count">'+draftCount()+'件変更</span><button id="editor-discard">取消</button><button class="primary" id="editor-save" '+(draftCount()?'':'disabled')+'>端末内に保存</button>');}
function input(e,v){if(v===get(e,self))delete drafts[e];else drafts[e]=v;document.querySelectorAll('[data-input-event="'+e+'"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.inputValue===v)));$('[data-fieldset="'+e+'"]')?.classList.toggle('changed',Object.hasOwn(drafts,e));const c=count(e,null,true);$('[data-preview="'+e+'"]').textContent=`人数 ○${fmt(c[0])}／△${fmt(c[1])}（下書き）`;$('#edit-change-count').textContent=draftCount()+'件変更';$('#editor-save').disabled=!draftCount();}
function saveEditor(){const n=draftCount();for(const[e,v]of Object.entries(drafts))data.values[+e][personIndex(self)]=v;drafts={};saveData();$('#dialog').close();refresh();if($('#draft-notice'))$('#draft-notice').innerHTML='';tell(storageOK?`${name(self)}の${n}件を端末内に保存しました。本番は変更していません。`:'保存できませんでした。このページ内のみの変更です。');}
function openComments(e){show(`${events[e].date}のコメント`,`${summary(e)}<div id="comments">${data.comments[e].map(c=>`<p class="comment"><b>${esc(name(c.id))}</b><br>${esc(c.text)}</p>`).join('')||'<p class="muted">コメントなし</p>'}</div>${self?`<div class="field"><label for="comment">${name(self)}のコメント（任意）</label><textarea id="comment" data-comment-event="${e}" maxlength="500">${esc(commentDrafts[e]??data.comments[e].find(c=>c.id===self)?.text??'')}</textarea></div><div class="toolbar"><button class="primary" data-comment-save="${e}">端末内に保存</button><button data-comment-discard="${e}">入力を戻す</button></div><p class="status" id="comment-status" role="status"></p>`:`<button data-comment-choose="${e}">書く人を選ぶ</button>`}`);}
function personDetail(id){show(`${name(id)}の12日程`,`<table class="person-table"><caption>名前と記号で全12回を確認。個人別内訳はサンプル。</caption><thead><tr><th scope="col">日程・場所</th><th scope="col">回答</th></tr></thead><tbody>${events.map((ev,e)=>`<tr><th scope="row">${eventName(e)}<br><small>${ev.building} ${ev.room}</small></th><td class="${statusClass(get(e,id))}">${get(e,id)}</td></tr>`).join('')}</tbody></table>`);}
function openMatrix(){show('全12日程 × 40人',`<p class="muted">人数の根拠を日程横断で見る表示専用の表。横スクロールできます。</p><div class="matrix-wrap" tabindex="0" role="region" aria-label="全日程と40人の回答"><table class="matrix"><caption>左の日程・場所・人数は固定。名前から個人の12回へ。</caption><thead><tr><th scope="col">日程・場所・人数</th>${members.map(m=>`<th scope="col"><button data-person="${m.id}">${name(m.id)}<br>${m.part}</button></th>`).join('')}</tr></thead><tbody>${events.map((ev,e)=>`<tr><th scope="row">${eventName(e)}<br>${ev.building} ${ev.room}<br>○${fmt(count(e)[0])}／△${fmt(count(e)[1])}</th>${data.values[e].map(v=>`<td class="${statusClass(v)}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);}
function openPeople(){show('人を探す',`<div class="field"><label for="people-search">名前またはパート</label><input id="people-search" class="search" type="search" placeholder="例：山田、Cl3、Tp"></div><ul class="people-find">${members.map(m=>`<li data-search="${name(m.id)} ${m.part}"><button data-person="${m.id}">${name(m.id)}　12回を見る ›</button></li>`).join('')}</ul>`);}
document.addEventListener('click',event=>{const b=event.target.closest('button,a[data-open-event]');if(!b)return;const d=b.dataset;if(d.detailTab){selectDetailTab(d.detailTab,+d.event);}else if(d.view){view=d.view;expanded=null;part=null;render();}else if(b.id==='identity-button'||b.id==='self-heading'||b.id==='choose-performer')choosePerson();else if(b.id==='confirm-person')activatePerson();else if(d.openEvent!==undefined){if(b.matches('a')&&(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey))return;event.preventDefault();openEvent(+d.openEvent);}else if(d.collapse!==undefined)collapse(+d.collapse);else if(b.id==='back-schedule')back();else if(d.part){part=d.part;const e=+d.forEvent;$('#panel-'+e).outerHTML=panel(e);$('#panel-title-'+e)?.focus({preventScroll:true});}else if(d.backParts!==undefined){part=null;const e=+d.backParts;$('#panel-'+e).outerHTML=panel(e);$('#panel-title-'+e)?.focus({preventScroll:true});}else if(d.editOne!==undefined)openEditor([+d.editOne]);else if(b.id==='edit-pending')openEditor('pending');else if(b.id==='edit-all')openEditor('all');else if(b.id==='resume-editor')openEditor(editor?.scope||'pending');else if(d.editorScope)openEditor(d.editorScope);else if(d.inputEvent!==undefined)input(+d.inputEvent,d.inputValue);else if(b.id==='editor-save')saveEditor();else if(b.id==='editor-discard'){drafts={};$('#dialog').close();if($('#draft-notice'))$('#draft-notice').innerHTML='';tell('未保存の回答を取り消しました。');}else if(b.id==='dialog-close')$('#dialog').close();else if(d.comments!==undefined)openComments(+d.comments);else if(d.commentChoose!==undefined){$('#dialog').close();choosePerson({type:'comments',event:+d.commentChoose});}else if(d.commentSave!==undefined){const e=+d.commentSave,text=$('#comment').value.trim(),old=data.comments[e].find(c=>c.id===self);if(!text){if(old)data.comments[e]=data.comments[e].filter(c=>c.id!==self);else{$('#comment-status').textContent='コメントを入力してください。';return;}}else if(old)old.text=text;else data.comments[e].push({id:self,text});delete commentDrafts[e];saveData();$('#comments').innerHTML=data.comments[e].map(c=>`<p class="comment"><b>${esc(name(c.id))}</b><br>${esc(c.text)}</p>`).join('')||'<p class="muted">コメントなし</p>';$('#comment-status').textContent=storageOK?'端末内に保存しました。':'このページ内のみの変更です。';refresh();}else if(d.commentDiscard!==undefined){const e=+d.commentDiscard;delete commentDrafts[e];$('#comment').value=data.comments[e].find(c=>c.id===self)?.text||'';}else if(d.person)personDetail(d.person);else if(b.id==='matrix-open')openMatrix();else if(b.id==='people-open')openPeople();else if(b.id==='forget'){if(hasUnsaved()){tell('入力中の変更を保存・取消してから解除してください。');return;}self=null;try{localStorage.removeItem('unionboard:v4:person');}catch{storageOK=false;}render();tell('回答対象の記憶を解除しました。');}else if(b.id==='reset'){data=seed();drafts={};commentDrafts={};saveData();expanded=null;part=null;render();tell('試作の回答・コメントを初期化しました。');}});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='identity-part'){$('#identity-person').innerHTML=personOptions(null,t.value);$('#confirm-person').disabled=true;}else if(t.id==='identity-person')$('#confirm-person').disabled=!person(t.value);else if(t.id==='layout'){layout=t.value;expanded=null;part=null;render();tell('内訳の開き方を'+(layout==='inline'?'行内展開':'詳細画面')+'に変更しました。');}else if(t.id==='count-style'){countStyle=t.value;render();}});
document.addEventListener('input',event=>{const t=event.target;if(t.id==='comment')commentDrafts[+t.dataset.commentEvent]=t.value;else if(t.id==='people-search'){const q=t.value.toLowerCase();document.querySelectorAll('[data-search]').forEach(li=>li.hidden=!li.dataset.search.toLowerCase().includes(q));}});
$('#dialog').addEventListener('close',()=>{if(draftCount()&&$('#draft-notice'))$('#draft-notice').innerHTML='<div class="save-note">未保存の回答 '+draftCount()+'件。<button id="resume-editor">入力を再開</button></div>';});
const initialHash=location.hash.match(/^#event-(\d+)$/);if(initialHash&&+initialHash[1]<12)detailEvent=+initialHash[1];else history.replaceState(null,'','#schedule');render();
</script></body></html>
