name: Keep alive Supabase

on:
  schedule:
    # Free Plan のプロジェクトは 7 日間利用がないと pause される可能性がある。
    # Supabase の外部から 1 日 2 回 Data API 経由で軽量な DB write を発生させる。
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Keep alive (${{ matrix.environment }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - prd

    steps:
      - name: Record Supabase keep-alive ping
        shell: bash
        env:
          TARGET_ENV: ${{ matrix.environment }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SPACE_ID: ${{ vars.VITE_SPACE_ID }}
          SUPABASE_KEEPALIVE_TOKEN: ${{ secrets.SUPABASE_KEEPALIVE_TOKEN }}
        run: |
          set -euo pipefail

          : "${SUPABASE_URL:?VITE_SUPABASE_URL is not set}"
          : "${SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY is not set}"
          : "${SPACE_ID:?VITE_SPACE_ID is not set}"

          request_body="$(
            jq -nc \
              --arg space_id "${SPACE_ID}" \
              --arg token "${SUPABASE_KEEPALIVE_TOKEN:-}" \
              '{p_space_id: $space_id, p_token: $token}'
          )"
          response_file="${RUNNER_TEMP}/supabase-keepalive-${TARGET_ENV}.json"
          http_status="$(
            curl -sS -o "${response_file}" -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/rpc/record_keepalive" \
              --data "${request_body}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json"
          )"

          if [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
            echo "::error::Supabase keep-alive failed for ${TARGET_ENV} (HTTP ${http_status})."
            sed -n '1,20p' "${response_file}"
            exit 1
          fi

          if ! jq -e '.success == true' "${response_file}" >/dev/null; then
            echo "::error::Supabase keep-alive RPC rejected for ${TARGET_ENV}."
            sed -n '1,20p' "${response_file}"
            exit 1
          fi

          last_ping_at="$(jq -r '.lastPingAt' "${response_file}")"
          ping_count="$(jq -r '.pingCount' "${response_file}")"
          echo "Supabase keep-alive succeeded for ${TARGET_ENV}: ${last_ping_at} (${ping_count})."
