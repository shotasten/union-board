name: Deploy keep-alive Worker

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/keepalive/**
      - .github/workflows/deploy-keepalive.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target environment
        required: true
        default: all
        type: choice
        options:
          - dev
          - prd
          - all

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy keep-alive (${{ matrix.environment }})
    if: github.event_name == 'push' || inputs.environment == 'all' || inputs.environment == matrix.environment
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - prd

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/keepalive
          command: deploy --env ${{ matrix.environment }}

      - name: Setup Node.js for secret sync
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler CLI for secret sync
        run: npm install --global wrangler@4

      - name: Sync Worker secrets
        run: |
          printf '%s' "$SUPABASE_URL" | wrangler secret put SUPABASE_URL --env "$TARGET_ENV"
          printf '%s' "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY --env "$TARGET_ENV"
          printf '%s' "$SPACE_ID" | wrangler secret put SPACE_ID --env "$TARGET_ENV"
          printf '%s' "$SUPABASE_KEEPALIVE_TOKEN" | wrangler secret put SUPABASE_KEEPALIVE_TOKEN --env "$TARGET_ENV"
        working-directory: cloudflare/keepalive
        env:
          TARGET_ENV: ${{ matrix.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SPACE_ID: ${{ vars.VITE_SPACE_ID }}
          SUPABASE_KEEPALIVE_TOKEN: ${{ secrets.SUPABASE_KEEPALIVE_TOKEN }}
