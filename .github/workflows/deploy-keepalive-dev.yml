name: Deploy keep-alive Worker (dev)

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/keepalive/**
      - .github/workflows/deploy-keepalive-dev.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy keep-alive (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/keepalive
          command: deploy --env dev

      - name: Setup Node.js for secret sync
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install Wrangler CLI for secret sync
        run: npm install --global wrangler@4

      - name: Sync Worker secrets
        run: |
          printf '%s' "$SUPABASE_URL" | wrangler secret put SUPABASE_URL --env dev
          printf '%s' "$SUPABASE_ANON_KEY" | wrangler secret put SUPABASE_ANON_KEY --env dev
          printf '%s' "$SPACE_ID" | wrangler secret put SPACE_ID --env dev
          printf '%s' "$SUPABASE_KEEPALIVE_TOKEN" | wrangler secret put SUPABASE_KEEPALIVE_TOKEN --env dev
        working-directory: cloudflare/keepalive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SPACE_ID: ${{ vars.VITE_SPACE_ID }}
          SUPABASE_KEEPALIVE_TOKEN: ${{ secrets.SUPABASE_KEEPALIVE_TOKEN }}
